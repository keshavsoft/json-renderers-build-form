<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertical Form Sample - json-renderers-build-form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">
  <main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h1 class="h4 mb-1">Vertical Form (Powered by Input-Row)</h1>
        <p class="text-muted small mb-0">Compiled JSON-to-DOM specification for a stacked Bootstrap form</p>
      </div>
      <a href="../index.html" class="btn btn-outline-secondary btn-sm">← All Samples</a>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card p-3 shadow-sm">
          <h6 class="text-muted mb-3">DOM Rendered Form:</h6>
          <div id="render-target"></div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card p-3 shadow-sm">
          <h6 class="text-muted mb-2">Compiled Spec (JSON):</h6>
          <pre id="spec-output" class="bg-dark text-light p-3 rounded small mb-0" style="max-height: 500px; overflow-y: auto;"></pre>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./index.js"></script>
</body>

</html>
