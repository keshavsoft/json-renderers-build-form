<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add a Contact - Form Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <base href="/samples/vertical/">
</head>

<body class="bg-body-tertiary">
  <main class="container py-5" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-5">
      <a href="../index.html" class="link-secondary text-decoration-none small">← All samples</a>
      <span class="badge text-bg-light border text-secondary fw-normal">FORM PREVIEW</span>
    </div>

    <header class="mb-4">
      <p class="text-primary text-uppercase fw-semibold small mb-2">Contacts</p>
      <h1 class="display-6 fw-semibold mb-2">Add a contact</h1>
      <p class="text-secondary mb-0">Create a contact record and choose how you’d like to stay in touch.</p>
    </header>

    <section class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="mb-4">
          <h2 class="h5 mb-1">Contact details</h2>
          <p class="text-secondary small mb-0">Full name and email address are required.</p>
        </div>
        <div id="render-target"></div>
        <div id="form-status" class="alert d-none mt-3 mb-0" role="status" aria-live="polite"></div>
      </div>
    </section>

    <p class="text-secondary small text-center mt-4 mb-0">This is a local form preview. Your entries stay in this demo.
    </p>
  </main>

  <script type="module" src="./index.js"></script>
</body>

</html>
