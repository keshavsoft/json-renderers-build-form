<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Big Buttons Form - json-renderers-build-form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <base href="/samples/bigButtons/">
</head>

<body class="bg-body-tertiary">
  <main class="container py-5" style="max-width: 1100px;">
    <div class="d-flex align-items-center justify-content-between mb-5">
      <a href="../index.html" class="link-secondary text-decoration-none small">← All samples</a>
      <span class="badge text-bg-light border text-secondary fw-normal">INSTRUCTION-DRIVEN FORM</span>
    </div>

    <header class="mb-4">
      <p class="text-primary text-uppercase fw-semibold small mb-2">Big Buttons</p>
      <h1 class="display-6 fw-semibold mb-2">Header, body, and footer</h1>
      <p class="text-secondary mb-0">The form skeleton, fields, actions, and classes are assembled from JSON instructions.</p>
    </header>

    <div id="render-target"></div>
    <div id="form-status" class="alert d-none mt-3" role="status" aria-live="polite"></div>

    <section class="card border-0 shadow-sm mt-4">
      <div class="card-body">
        <h2 class="h6">Generated form spec</h2>
        <pre id="spec-output" class="bg-dark text-light p-3 rounded small mb-0" style="max-height: 420px; overflow: auto;"></pre>
      </div>
    </section>
  </main>

  <script type="module" src="./index.js"></script>
</body>

</html>
